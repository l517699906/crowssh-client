<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CrowSSH rounded platform logo</title>
  <desc id="desc">The existing CrowSSH raven artwork, uniformly scaled inside one transparent rounded-square platform mask.</desc>
  <defs>
    <clipPath id="platform-mask">
      <rect x="64" y="64" width="896" height="896" rx="208" />
    </clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#0B0F15" clip-path="url(#platform-mask)" />
  <image
    x="-32"
    y="-32"
    width="1088"
    height="1088"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#platform-mask)"
    href="crowssh-original-logo.png"
    xlink:href="crowssh-original-logo.png"
  />
  <rect x="70" y="70" width="884" height="884" rx="202" fill="none" stroke="#263141" stroke-width="12" opacity="0.96" />
</svg>
